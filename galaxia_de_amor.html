<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galáxia do Nosso Amor</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030208;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
        }

        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* TELA INICIAL DE BOAS-VINDAS */
        #landing-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a0b2e 0%, #05020a 100%);
            transition: opacity 1.2s ease, visibility 1.2s ease;
        }

        #landing-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .landing-card {
            background: rgba(18, 10, 30, 0.75);
            border: 1px solid rgba(255, 100, 200, 0.25);
            border-radius: 28px;
            padding: 40px 30px;
            width: 90%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 0 50px rgba(180, 50, 255, 0.25), inset 0 0 20px rgba(255, 0, 128, 0.15);
            backdrop-filter: blur(16px);
            animation: floatCard 4s ease-in-out infinite alternate;
        }

        @keyframes floatCard {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-10px); }
        }

        .landing-title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #ff80df 50%, #80dfff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            line-height: 1.2;
            text-shadow: 0 0 20px rgba(255, 128, 223, 0.3);
        }

        .illustration-box {
            width: 160px;
            height: 140px;
            margin: 10px auto 25px auto;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bunnies-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 12px rgba(255, 150, 220, 0.6));
        }

        .subtitle-text {
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #d1b3ff;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .btn-enter {
            background: linear-gradient(90deg, #ff416c, #ff4b2b, #8a2be2);
            background-size: 200% auto;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 65, 108, 0.6);
            transition: all 0.4s ease;
            text-transform: uppercase;
        }

        .btn-enter:hover {
            background-position: right center;
            transform: scale(1.06);
            box-shadow: 0 0 35px rgba(255, 65, 108, 0.9);
        }

        /* CONTROLES HUD NA GALÁXIA */
        .hud-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease 1s;
        }

        .hud-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .hud-title {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #ff99dd;
            text-shadow: 0 0 10px rgba(255, 153, 221, 0.8);
        }

        .hud-buttons {
            display: flex;
            gap: 12px;
        }

        .hud-btn {
            background: rgba(20, 10, 35, 0.7);
            border: 1px solid rgba(0, 229, 255, 0.4);
            color: #00e5ff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
        }

        .hud-btn:hover {
            background: rgba(0, 229, 255, 0.2);
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
        }

        /* MODAL DE FOTO SEM CORTES E SEM TEXTOS INDEFINIDOS */
        .modal-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            background: rgba(3, 1, 10, 0.88);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            padding: 20px;
        }

        .modal-container.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: linear-gradient(135deg, rgba(25, 15, 45, 0.95), rgba(10, 5, 20, 0.95));
            border: 1px solid rgba(0, 229, 255, 0.4);
            box-shadow: 0 0 40px rgba(138, 43, 226, 0.4), inset 0 0 15px rgba(0, 229, 255, 0.2);
            border-radius: 24px;
            padding: 20px;
            max-width: 90vw;
            max-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-container.active .modal-card {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: -15px;
            right: -15px;
            background: #ff3366;
            border: 2px solid #ffffff;
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            z-index: 10;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.8);
        }

        .close-btn:hover {
            transform: scale(1.15);
            background: #ff0044;
        }

        .modal-img-frame {
            width: 100%;
            height: 100%;
            max-height: 75vh;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(0, 229, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #05020a;
        }

        .modal-img-frame img {
            max-width: 100%;
            max-height: 75vh;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            border-radius: 12px;
        }

        .hint-toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 8, 30, 0.8);
            border: 1px solid rgba(0, 229, 255, 0.4);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #b3f0ff;
            z-index: 10;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
            opacity: 0;
            transition: opacity 1s ease 2s;
        }

        .hint-toast.visible {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Música BTS - Love Is Not Over -->
    <audio id="bg-audio" loop preload="auto">
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <!-- Container WebGL 3D -->
    <div id="webgl-container"></div>

    <!-- Tela Inicial (Landing Page) -->
    <div id="landing-screen">
        <div class="landing-card">
            <h1 class="landing-title">Una Galaxia de Amor para Ti</h1>
            
            <div class="illustration-box">
                <svg class="bunnies-svg" viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M100 45 C100 45, 85 25, 70 35 C55 45, 65 65, 100 95 C135 65, 145 45, 130 35 C115 25, 100 45, 100 45 Z" fill="#ff3366" opacity="0.9">
                        <animate attributeName="transform" type="scale" values="1; 1.12; 1" additive="sum" dur="1.5s" repeatCount="indefinite" transform-origin="100 60"/>
                    </path>
                    <g transform="translate(45, 65)">
                        <ellipse cx="30" cy="40" rx="18" ry="15" fill="#ffffff"/>
                        <circle cx="28" cy="22" r="14" fill="#ffffff"/>
                        <ellipse cx="20" cy="8" rx="4" ry="10" fill="#ffffff" transform="rotate(-10 20 8)"/>
                        <ellipse cx="32" cy="8" rx="4" ry="10" fill="#ffffff" transform="rotate(10 32 8)"/>
                        <circle cx="24" cy="20" r="1.8" fill="#333"/>
                        <circle cx="32" cy="20" r="1.8" fill="#333"/>
                        <ellipse cx="28" cy="24" rx="2" ry="1.2" fill="#ff99bb"/>
                    </g>
                    <g transform="translate(85, 70)">
                        <ellipse cx="30" cy="35" rx="16" ry="13" fill="#f0e6ff"/>
                        <circle cx="26" cy="20" r="12" fill="#f0e6ff"/>
                        <ellipse cx="20" cy="6" rx="3.5" ry="9" fill="#f0e6ff" transform="rotate(-15 20 6)"/>
                        <ellipse cx="30" cy="6" rx="3.5" ry="9" fill="#f0e6ff" transform="rotate(5 30 6)"/>
                        <circle cx="22" cy="18" r="1.5" fill="#333"/>
                        <circle cx="29" cy="18" r="1.5" fill="#333"/>
                        <ellipse cx="25.5" cy="21" rx="1.8" ry="1" fill="#ff99bb"/>
                    </g>
                </svg>
            </div>

            <p class="subtitle-text">Para o meu amor mais especial</p>
            
            <button class="btn-enter" id="btn-start">
                Entrar no Nosso Universo
            </button>
        </div>
    </div>

    <!-- Interface HUD -->
    <div class="hud-overlay" id="hud">
        <div class="hud-title">Nosso Universo de Memórias</div>
        <div class="hud-buttons">
            <button class="hud-btn" id="btn-audio" title="Tocar / Pausar Música (BTS - Love Is Not Over)">
                <i data-lucide="music"></i>
            </button>
        </div>
    </div>

    <div class="hint-toast" id="hint-toast">
        ✨ Clique nos planetas-fotos orbitando para ver momentos especiais!
    </div>

    <!-- Modal de Visualização da Memória -->
    <div class="modal-container" id="modal-view">
        <div class="modal-card">
            <button class="close-btn" id="modal-close">
                <i data-lucide="x"></i>
            </button>
            <div class="modal-img-frame">
                <img id="modal-img" src="" alt="Momento Especial">
            </div>
        </div>
    </div>

    <script>
        // --- DADOS DAS MEMÓRIAS COM AS SUAS FOTOS ---
        const DEFAULT_MEMORIES = [
            { id: 1, img: "beijoaniversariolay.jpeg" },
            { id: 2, img: "sorriso.jpeg" },
            { id: 3, img: "abracadinho.jpg" },
            { id: 4, img: "beijonacabeca.jpg" },
            { id: 5, img: "carro.jpg" },
            { id: 6, img: "cinema.jpeg" },
            { id: 7, img: "cinemamao.jpg" },
            { id: 8, img: "dois.jpg" },
            { id: 9, img: "feiradolivro.jpeg" },
            { id: 10, img: "juntosnoquarto.jpeg" },
            { id: 11, img: "oculos.jpeg" },
            { id: 12, img: "patinho.jpeg" },
            { id: 13, img: "praca.jpeg" },
            { id: 14, img: "primeirafotopublica.jpg" },
            { id: 15, img: "show.jpeg" },
            { id: 16, img: "sorriso.jpeg" },
            { id: 17, img: "sorvete.jpg" },
            { id: 18, img: "segundajuntos.jpg" }
        ];

        const memories = DEFAULT_MEMORIES;

        // Frases Flutuantes no Espaço
        const FLOATING_TEXTS = [
            "INFINITO ∞", "AMOR ETERNO", "TE AMO", "MY LOVE", 
            "AMOR DE MI VIDA", "MEU TUDO", "MEU PORTO SEGURO", "PARA SEMPRE", "O MAIOR AMOR DO MUNDO TODO", "MEU AMOR POR TI NUNCA ACABARÁ", "VOCÊ É MINHA LUA", "MINHA RAZÃO DE CONTINUAR"
        ];

        // --- CONFIGURAÇÃO THREE.JS ---
        let scene, camera, renderer, controls;
        let galaxyParticles, coreGlow, nebulaCloud;
        let planetObjects = [];
        let heartParticles;
        let isGalaxyActive = false;

        const container = document.getElementById('webgl-container');

        function initThree() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030208, 0.002);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 50, 90);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 180;
            controls.minDistance = 10;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const centerPointLight = new THREE.PointLight(0xffdd66, 3, 100);
            scene.add(centerPointLight);

            createGalaxySpiral();
            createYellowCore();
            createNebulaBackground();
            createHeartConstellation();
            createFloatingTexts();
            buildPhotoPlanets();

            window.addEventListener('resize', onWindowResize);
            setupInteractions();
        }

        function createGalaxySpiral() {
            const particleCount = 45000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            const colorCore = new THREE.Color(0xffea79);
            const colorCyan = new THREE.Color(0x00f0ff);
            const colorBlue = new THREE.Color(0x4040ff);
            const colorPurple = new THREE.Color(0xb020ff);
            const colorPink = new THREE.Color(0xff33aa);

            const branches = 3;
            const radius = 65;

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const r = Math.pow(Math.random(), 2) * radius;
                const spinAngle = r * 0.4;
                const branchAngle = ((i % branches) * 2 * Math.PI) / branches;

                const randomX = (Math.random() - 0.5) * (Math.pow(r, 0.8) * 0.4);
                const randomY = (Math.random() - 0.5) * (Math.pow(r, 0.8) * 0.3);
                const randomZ = (Math.random() - 0.5) * (Math.pow(r, 0.8) * 0.4);

                positions[i3] = Math.cos(branchAngle + spinAngle) * r + randomX;
                positions[i3 + 1] = randomY;
                positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * r + randomZ;

                let mixedColor;
                const normR = r / radius;
                if (normR < 0.15) {
                    mixedColor = colorCore.clone().lerp(colorCyan, normR / 0.15);
                } else if (normR < 0.45) {
                    mixedColor = colorCyan.clone().lerp(colorBlue, (normR - 0.15) / 0.3);
                } else if (normR < 0.75) {
                    mixedColor = colorBlue.clone().lerp(colorPurple, (normR - 0.45) / 0.3);
                } else {
                    mixedColor = colorPurple.clone().lerp(colorPink, (normR - 0.75) / 0.25);
                }

                colors[i3] = mixedColor.r;
                colors[i3 + 1] = mixedColor.g;
                colors[i3 + 2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 16, 16);
            const pTexture = new THREE.CanvasTexture(canvas);

            const material = new THREE.PointsMaterial({
                size: 0.65,
                vertexColors: true,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending,
                map: pTexture,
                depthWrite: false
            });

            galaxyParticles = new THREE.Points(geometry, material);
            scene.add(galaxyParticles);
        }

        function createYellowCore() {
            const coreGeo = new THREE.SphereGeometry(3.5, 32, 32);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0xfff090, transparent: true, opacity: 0.95 });
            coreGlow = new THREE.Mesh(coreGeo, coreMat);
            scene.add(coreGlow);

            const haloGeo = new THREE.SphereGeometry(7, 32, 32);
            const haloMat = new THREE.MeshBasicMaterial({
                color: 0xffbb00, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending
            });
            const halo = new THREE.Mesh(haloGeo, haloMat);
            scene.add(halo);
        }

        function createNebulaBackground() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            const g = ctx.createRadialGradient(256, 256, 20, 256, 256, 250);
            g.addColorStop(0, 'rgba(0, 220, 255, 0.3)');
            g.addColorStop(0.4, 'rgba(120, 30, 220, 0.2)');
            g.addColorStop(0.8, 'rgba(200, 20, 150, 0.1)');
            g.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 512, 512);

            const texture = new THREE.CanvasTexture(canvas);
            const geo = new THREE.PlaneGeometry(160, 160);
            const mat = new THREE.MeshBasicMaterial({
                map: texture, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
            });

            nebulaCloud = new THREE.Mesh(geo, mat);
            nebulaCloud.rotation.x = Math.PI / 2;
            scene.add(nebulaCloud);
        }

        function createHeartConstellation() {
            const heartGeo = new THREE.BufferGeometry();
            const count = 3000;
            const pos = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                const t = Math.PI * 2 * Math.random();
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                let z = (Math.random() - 0.5) * 6;

                x *= 0.45; y *= 0.45; z *= 0.45;

                pos[i*3] = x;
                pos[i*3 + 1] = y + 14;
                pos[i*3 + 2] = z;
            }

            heartGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const heartMat = new THREE.PointsMaterial({
                color: 0xff3366, size: 0.5, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending
            });

            heartParticles = new THREE.Points(heartGeo, heartMat);
            scene.add(heartParticles);
        }

        function createFloatingTexts() {
            FLOATING_TEXTS.forEach((textStr, i) => {
                const canvas = document.createElement('canvas');
                canvas.width = 256; canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.font = 'bold 24px Poppins';
                ctx.fillStyle = '#ff66cc';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#00e5ff';
                ctx.shadowBlur = 10;
                ctx.fillText(textStr, 128, 40);

                const texture = new THREE.CanvasTexture(canvas);
                const mat = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.85 });
                const sprite = new THREE.Sprite(mat);

                const angle = (i / FLOATING_TEXTS.length) * Math.PI * 2;
                const dist = 22 + Math.random() * 25;
                sprite.position.set(Math.cos(angle) * dist, (Math.random() - 0.5) * 12, Math.sin(angle) * dist);
                sprite.scale.set(12, 3, 1);
                scene.add(sprite);
            });
        }

        // TEXTURA RESPONSIVA PARA PLANETAS ESFÉRICOS
        function createResponsiveTexture(imageSrc, callback) {
            const img = new Image();
            img.src = imageSrc;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#0a0518';
                ctx.fillRect(0, 0, 512, 512);

                const imgAspect = img.width / img.height;
                let drawWidth = 512;
                let drawHeight = 512;
                let offsetX = 0;
                let offsetY = 0;

                if (imgAspect > 1) {
                    drawWidth = 512 * imgAspect;
                    offsetX = -(drawWidth - 512) / 2;
                } else {
                    drawHeight = 512 / imgAspect;
                    offsetY = -(drawHeight - 512) / 2;
                }

                ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);

                const texture = new THREE.CanvasTexture(canvas);
                callback(texture);
            };
            img.onerror = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 256; canvas.height = 256;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ff0066';
                ctx.fillRect(0, 0, 256, 256);
                callback(new THREE.CanvasTexture(canvas));
            };
        }

        function buildPhotoPlanets() {
            planetObjects.forEach(p => scene.remove(p.group));
            planetObjects = [];

            const total = memories.length;

            memories.forEach((mem, index) => {
                const planetGroup = new THREE.Group();
                const orbitRadius = 14 + (index * 3.2);
                const angle = (index / total) * Math.PI * 2 * 1.5;
                const speed = 0.0025 + (index * 0.0002);

                const sphereGeo = new THREE.SphereGeometry(2.6, 32, 32);

                createResponsiveTexture(mem.img, (responsiveTexture) => {
                    const planetMat = new THREE.MeshStandardMaterial({
                        map: responsiveTexture,
                        roughness: 0.3,
                        metalness: 0.1,
                        emissive: 0x111122,
                        emissiveIntensity: 0.2
                    });

                    const planetMesh = new THREE.Mesh(sphereGeo, planetMat);
                    planetGroup.add(planetMesh);
                    planetGroup.userData.mesh = planetMesh;
                });

                const ringGeo = new THREE.RingGeometry(3.3, 4.0, 32);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: index % 2 === 0 ? 0x00e5ff : 0xff00aa,
                    side: THREE.DoubleSide, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2.5;
                planetGroup.add(ring);

                const glowGeo = new THREE.SphereGeometry(2.9, 16, 16);
                const glowMat = new THREE.MeshBasicMaterial({
                    color: index % 2 === 0 ? 0x00e5ff : 0xff3399,
                    transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending
                });
                const atmosphere = new THREE.Mesh(glowGeo, glowMat);
                planetGroup.add(atmosphere);

                planetGroup.position.x = Math.cos(angle) * orbitRadius;
                planetGroup.position.z = Math.sin(angle) * orbitRadius;
                planetGroup.position.y = (Math.sin(index) * 2.5);

                planetGroup.userData = {
                    id: mem.id, img: mem.img,
                    orbitRadius: orbitRadius, angle: angle, speed: speed
                };

                scene.add(planetGroup);
                planetObjects.push({ group: planetGroup, data: planetGroup.userData });
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            if (galaxyParticles) galaxyParticles.rotation.y += 0.0008;
            if (nebulaCloud) nebulaCloud.rotation.z -= 0.0005;
            if (coreGlow) coreGlow.rotation.y += 0.005;
            if (heartParticles) {
                heartParticles.rotation.y += 0.003;
                const time = Date.now() * 0.0025;
                const scale = 1 + Math.sin(time) * 0.08;
                heartParticles.scale.set(scale, scale, scale);
            }

            planetObjects.forEach(p => {
                p.data.angle += p.data.speed;
                p.group.position.x = Math.cos(p.data.angle) * p.data.orbitRadius;
                p.group.position.z = Math.sin(p.data.angle) * p.data.orbitRadius;

                if (p.group.userData.mesh) {
                    p.group.userData.mesh.rotation.y += 0.008;
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function setupInteractions() {
            window.addEventListener('click', (event) => {
                if (!isGalaxyActive) return;
                if (event.target.closest('#hud') || event.target.closest('#modal-view')) return;

                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);

                const meshesToTest = [];
                planetObjects.forEach(p => {
                    p.group.traverse(child => {
                        if (child.isMesh) {
                            child.userData.parentGroup = p.group;
                            meshesToTest.push(child);
                        }
                    });
                });

                const intersects = raycaster.intersectObjects(meshesToTest);

                if (intersects.length > 0) {
                    const hitGroup = intersects[0].object.userData.parentGroup;
                    if (hitGroup && hitGroup.userData) {
                        openMemoryModal(hitGroup.userData);
                        focusCameraOnPlanet(hitGroup.position);
                    }
                }
            });
        }

        function focusCameraOnPlanet(targetPos) {
            const startPos = camera.position.clone();
            const endPos = new THREE.Vector3(
                targetPos.x * 1.3,
                targetPos.y + 6,
                targetPos.z * 1.3
            );

            let progress = 0;
            const animateZoom = () => {
                progress += 0.04;
                if (progress <= 1) {
                    camera.position.lerpVectors(startPos, endPos, progress);
                    controls.target.copy(targetPos);
                    requestAnimationFrame(animateZoom);
                }
            };
            animateZoom();
        }

        function openMemoryModal(data) {
            document.getElementById('modal-img').src = data.img;
            document.getElementById('modal-view').classList.add('active');
        }

        document.getElementById('modal-close').addEventListener('click', () => {
            document.getElementById('modal-view').classList.remove('active');
        });

        // Tocar Música BTS - Love Is Not Over
        const bgAudio = document.getElementById('bg-audio');
        let isAudioPlaying = false;

        function playMusic() {
            bgAudio.play().then(() => {
                isAudioPlaying = true;
                document.getElementById('btn-audio').style.color = '#ff33aa';
                document.getElementById('btn-audio').style.borderColor = '#ff33aa';
            }).catch(err => {
                console.log("Aguardando interação do usuário para reproduzir áudio.");
            });
        }

        document.getElementById('btn-audio').addEventListener('click', () => {
            if (isAudioPlaying) {
                bgAudio.pause();
                isAudioPlaying = false;
                document.getElementById('btn-audio').style.color = '#00e5ff';
                document.getElementById('btn-audio').style.borderColor = 'rgba(0, 229, 255, 0.4)';
            } else {
                playMusic();
            }
        });

        document.getElementById('btn-start').addEventListener('click', () => {
            document.getElementById('landing-screen').classList.add('hidden');
            playMusic();

            let duration = 0;
            const startRadius = 300;
            camera.position.set(0, 180, startRadius);

            const bigBangAnim = () => {
                duration += 0.02;
                if (duration <= 1) {
                    camera.position.y = THREE.MathUtils.lerp(180, 45, duration);
                    camera.position.z = THREE.MathUtils.lerp(startRadius, 85, duration);
                    requestAnimationFrame(bigBangAnim);
                } else {
                    isGalaxyActive = true;
                    document.getElementById('hud').classList.add('visible');
                    document.getElementById('hint-toast').classList.add('visible');
                    setTimeout(() => {
                        document.getElementById('hint-toast').classList.remove('visible');
                    }, 6000);
                }
            };
            bigBangAnim();
        });

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = () => {
            initThree();
            animate();
            lucide.createIcons();
        };
    </script>
</body>
</html>
