    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010004;
            font-family: 'Cormorant Garamond', serif;
            color: #ffffff;
        }

        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* TELA INICIAL DE ENTRADA */
        #landing-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #100820 0%, #020006 100%);
            transition: opacity 2s ease, visibility 2s ease;
        }

        #landing-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .landing-card {
            background: rgba(10, 6, 20, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 45px 35px;
            width: 90%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 0 60px rgba(100, 50, 255, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
        }

        .landing-title {
            font-family: 'Cinzel', serif;
            font-size: 2.1rem;
            font-weight: 500;
            letter-spacing: 2px;
            color: #f3e8ff;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .illustration-box {
            width: 140px;
            height: 120px;
            margin: 15px auto 25px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bunnies-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 12px rgba(255, 180, 230, 0.6));
        }

        .subtitle-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.15rem;
            font-style: italic;
            letter-spacing: 2px;
            color: #d1c4e9;
            margin-bottom: 35px;

        .btn-enter {

            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            padding: 14px 36px;

            letter-spacing: 3px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.5s ease;
            text-transform: uppercase;

        .btn-enter:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);

        /* OVERLAY DA HISTÓRIA (MAIS ELEVADO E COM FADE MARCANTE) */
        #story-overlay {
            position: fixed;
            top: 20%; /* Posicionado mais para cima */
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            text-align: center;
            width: 90%;
            max-width: 800px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #story-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            font-weight: 400;
            color: #ffffff;
            letter-spacing: 2px;
            line-height: 1.4;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.7), 0 0 40px rgba(180, 200, 255, 0.5);
        }

        /* HUD CONTROLES NA GALÁXIA */
        .hud-overlay {
            position: fixed;
            top: 25px;
            left: 25px;
            right: 25px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .hud-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .hud-title {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: #e0d0ff;
            text-shadow: 0 0 15px rgba(224, 208, 255, 0.5);
        }

        .hud-buttons {
            display: flex;

        }

        .hud-btn {
            background: rgba(15, 10, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .hud-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.08);
        }

        /* MODAL DE FOTO INTEIRA */
        .modal-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            background: rgba(1, 0, 4, 0.93);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
            padding: 20px;

        .modal-container.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: rgba(15, 10, 25, 0.9);

            box-shadow: 0 0 50px rgba(120, 50, 255, 0.2);

            justify-content: center;
            align-items: center;
            position: relative;
            transform: scale(0.9);

        .close-btn {
            position: absolute;
            top: -15px;
            right: -15px;
            background: #ff3366;
            border: 2px solid #ffffff;
            color: white;
            width: 36px;

            border-radius: 50%;

            align-items: center;

    <script>
        // --- DADOS DAS SUAS MEMÓRIAS E FOTOS ---
        const DEFAULT_MEMORIES = [
            { id: 1, img: "beijoaniversariolay.jpeg" },
            { id: 2, img: "sorriso.jpeg" },
            { id: 3, img: "abracadinho.jpg" },

            { id: 16, img: "sorriso.jpeg" },
            { id: 17, img: "sorvete.jpg" },
            { id: 18, img: "segundajuntos.jpg" }
        ];

        const memories = DEFAULT_MEMORIES;

        const FLOATING_TEXTS = [
            "INFINITO ∞", "AMOR ETERNO", "TE AMO", "MY LOVE", 
            "AMOR DE MI VIDA", "MEU TUDO", "MEU PORTO SEGURO", "PARA SEMPRE"
        ];

        // Frases da História (Duram 1 minuto ao todo)
        const STORY_PHRASES = [
            "Em um universo infinito de possibilidades...",
            "Duas estrelas navegaram pela imensidão do espaço.",
            "Sem saber que o destino já havia traçado o seu encontro...",
            "No meu universo tem um lugar que não existia.",
            "E da colisão das nossas almas... nasceu a nossa galáxia."
        ];

        const STORY_TOTAL_DURATION = 60000; // 60 segundos

        // THREE.JS Variaveis
        let scene, camera, renderer, controls;
        let galaxyParticles, coreGlow, coreHalo, nebulaCloud, heartParticles, backgroundStars;
        let star1Group, star2Group, shockwaveParticles;
        let planetObjects = [];
        let floatingSpriteObjects = [];
        let isGalaxyActive = false;
        let isCollidingAnimation = false;
        let animStartTime = 0;

        const container = document.getElementById('webgl-container');

        // FUNÇÃO PARA CRIAR TEXTURA DE ESTRELA COM FLARE DE 4 PONTAS (ESTILO HUBBLE / FOTO REAL)
        function createRealisticStarTexture(hexColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            const cx = 128, cy = 128;

            // Brilho radial central
            const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.25, hexColor);
            grad.addColorStop(0.6, 'rgba(150, 180, 255, 0.2)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, 120, 0, Math.PI * 2);
            ctx.fill();

            // Flare em Cruz de 4 Pontas (Lens Flare de telescópio)
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.shadowColor = hexColor;
            ctx.shadowBlur = 15;

            // Ponta Vertical
            ctx.beginPath();
            ctx.moveTo(cx, 10);
            ctx.lineTo(cx, 246);
            ctx.stroke();

            // Ponta Horizontal
            ctx.beginPath();
            ctx.moveTo(10, cy);
            ctx.lineTo(246, cy);
            ctx.stroke();

            return new THREE.CanvasTexture(canvas);
        }

        function initThree() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x010004, 0.0018);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 45, 110);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 180;
            controls.minDistance = 10;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.4;

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const centerPointLight = new THREE.PointLight(0xffeedd, 3, 100);
            scene.add(centerPointLight);

            createBackgroundDeepStars();
            createBinaryStars();
            createGalaxySpiral();
            createYellowCore();
            createNebulaBackground();
            createHeartConstellation();
            createFloatingTexts();
            buildPhotoPlanets();

            hideGalaxyInitially();

            window.addEventListener('resize', onWindowResize);
            setupInteractions();
        }

        // Fundo com milhar de estrelas distantes
        function createBackgroundDeepStars() {
            const count = 6000;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);

            for(let i=0; i<count; i++) {
                pos[i*3] = (Math.random() - 0.5) * 400;
                pos[i*3+1] = (Math.random() - 0.5) * 400;
                pos[i*3+2] = (Math.random() - 0.5) * 400;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.6 });
            backgroundStars = new THREE.Points(geo, mat);
            scene.add(backgroundStars);
        }

        // CRIAR DUAS ESTRELAS REALISTAS COM LENS FLARE (PONTAS DE LUZ DO HUBBLE)
        function createBinaryStars() {
            star1Group = new THREE.Group();
            star2Group = new THREE.Group();

            const tex1 = createRealisticStarTexture('#00f0ff');
            const tex2 = createRealisticStarTexture('#ff33aa');

            // Sprite com o brilho e as 4 pontas
            const mat1 = new THREE.SpriteMaterial({ map: tex1, transparent: true, blending: THREE.AdditiveBlending });
            const sprite1 = new THREE.Sprite(mat1);
            sprite1.scale.set(22, 22, 1);
            star1Group.add(sprite1);

            const mat2 = new THREE.SpriteMaterial({ map: tex2, transparent: true, blending: THREE.AdditiveBlending });
            const sprite2 = new THREE.Sprite(mat2);
            sprite2.scale.set(22, 22, 1);
            star2Group.add(sprite2);

            star1Group.position.set(-80, 0, 0);
            star2Group.position.set(80, 0, 0);

            scene.add(star1Group);
            scene.add(star2Group);

            // Partículas da onda de choque
            const pCount = 4500;
            const shockGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(pCount * 3);
            const velocities = new Float32Array(pCount * 3);

            for (let i = 0; i < pCount; i++) {
                positions[i*3] = 0;
                positions[i*3+1] = 0;
                positions[i*3+2] = 0;

                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                const speed = 0.2 + Math.random() * 1.8;

                velocities[i*3] = Math.sin(phi) * Math.cos(theta) * speed;
                velocities[i*3+1] = Math.sin(phi) * Math.sin(theta) * speed;
                velocities[i*3+2] = Math.cos(phi) * speed;
            }

            shockGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            shockGeo.userData = { velocities: velocities };

            const shockMat = new THREE.PointsMaterial({
                color: 0xffddff,
                size: 0.9,
                transparent: true,
                opacity: 0,
                blending: THREE.AdditiveBlending
            });

            shockwaveParticles = new THREE.Points(shockGeo, shockMat);
            scene.add(shockwaveParticles);
        }

        function hideGalaxyInitially() {
            if (galaxyParticles) galaxyParticles.visible = false;
            if (coreGlow) coreGlow.visible = false;
            if (coreHalo) coreHalo.visible = false;
            if (nebulaCloud) nebulaCloud.visible = false;
            if (heartParticles) heartParticles.visible = false;

            planetObjects.forEach(p => p.group.visible = false);
            floatingSpriteObjects.forEach(s => s.visible = false);
        }

        // GALÁXIA COM CORES E TEXTURA REAL DA FOTO DO HUBBLE (DOURADO + AZUL ESPIRAL)
        function createGalaxySpiral() {
            const particleCount = 55000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            // Paleta idêntica à imagem da NASA/Hubble
            const colorCore = new THREE.Color(0xffeedd); // Núcleo brilhante dourado/branco
            const colorDust = new THREE.Color(0xcc7744); // Poeira avermelhada do centro
            const colorCyan = new THREE.Color(0x77c2ff); // Azul claro das estrelas jovens nos braços
            const colorBlue = new THREE.Color(0x3355ee); // Azul profundo dos braços
            const colorOuter = new THREE.Color(0xaa44bb); // Purpura externo

            const branches = 2; // 2 braços espirais principais (como na NGC 1300)
            const radius = 68;

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const r = Math.pow(Math.random(), 2.2) * radius;
                const spinAngle = r * 0.35;
                const branchAngle = ((i % branches) * 2 * Math.PI) / branches;

                const randomX = (Math.random() - 0.5) * (Math.pow(r, 0.85) * 0.35);
                const randomY = (Math.random() - 0.5) * (Math.pow(r, 0.85) * 0.2);
                const randomZ = (Math.random() - 0.5) * (Math.pow(r, 0.85) * 0.35);

                positions[i3] = Math.cos(branchAngle + spinAngle) * r + randomX;
                positions[i3 + 1] = randomY;
                positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * r + randomZ;

                let mixedColor;
                const normR = r / radius;
                if (normR < 0.12) {
                    mixedColor = colorCore.clone().lerp(colorDust, normR / 0.12);
                } else if (normR < 0.4) {
                    mixedColor = colorDust.clone().lerp(colorCyan, (normR - 0.12) / 0.28);
                } else if (normR < 0.75) {
                    mixedColor = colorCyan.clone().lerp(colorBlue, (normR - 0.4) / 0.35);
                } else {
                    mixedColor = colorBlue.clone().lerp(colorOuter, (normR - 0.75) / 0.25);
                }

                colors[i3] = mixedColor.r;
                colors[i3 + 1] = mixedColor.g;
                colors[i3 + 2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 16, 16);
            const pTexture = new THREE.CanvasTexture(canvas);

            const material = new THREE.PointsMaterial({
                size: 0.6,
                vertexColors: true,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending,
                map: pTexture,
                depthWrite: false
            });

            galaxyParticles = new THREE.Points(geometry, material);
            scene.add(galaxyParticles);
        }

        function createYellowCore() {
            const coreGeo = new THREE.SphereGeometry(3.5, 32, 32);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0xfff5dd, transparent: true, opacity: 0.95 });
            coreGlow = new THREE.Mesh(coreGeo, coreMat);
            scene.add(coreGlow);

            const haloGeo = new THREE.SphereGeometry(8, 32, 32);
            const haloMat = new THREE.MeshBasicMaterial({
                color: 0xffaa44, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending
            });
            coreHalo = new THREE.Mesh(haloGeo, haloMat);
            scene.add(coreHalo);
        }

        function createNebulaBackground() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');

            const g = ctx.createRadialGradient(256, 256, 20, 256, 256, 250);
            g.addColorStop(0, 'rgba(255, 200, 120, 0.25)');
            g.addColorStop(0.35, 'rgba(60, 120, 240, 0.2)');
            g.addColorStop(0.7, 'rgba(120, 30, 180, 0.12)');
            g.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 512, 512);

            const texture = new THREE.CanvasTexture(canvas);
            const geo = new THREE.PlaneGeometry(160, 160);
            const mat = new THREE.MeshBasicMaterial({
                map: texture, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
            });

            nebulaCloud = new THREE.Mesh(geo, mat);
            nebulaCloud.rotation.x = Math.PI / 2;
            scene.add(nebulaCloud);
        }

        function createHeartConstellation() {
            const heartGeo = new THREE.BufferGeometry();
            const count = 3500;
            const pos = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                const t = Math.PI * 2 * Math.random();
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                let z = (Math.random() - 0.5) * 6;

                x *= 0.45; y *= 0.45; z *= 0.45;

                pos[i*3] = x;
                pos[i*3 + 1] = y + 14;
                pos[i*3 + 2] = z;
            }

            heartGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const heartMat = new THREE.PointsMaterial({
                color: 0xff3366, size: 0.5, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending
            });

            heartParticles = new THREE.Points(heartGeo, heartMat);
            scene.add(heartParticles);
        }

        function createFloatingTexts() {
            FLOATING_TEXTS.forEach((textStr, i) => {
                const canvas = document.createElement('canvas');
                canvas.width = 256; canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.font = 'bold 24px Poppins';
                ctx.fillStyle = '#ff88dd';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#00e5ff';
                ctx.shadowBlur = 10;
                ctx.fillText(textStr, 128, 40);

                const texture = new THREE.CanvasTexture(canvas);
                const mat = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.85 });
                const sprite = new THREE.Sprite(mat);

                const angle = (i / FLOATING_TEXTS.length) * Math.PI * 2;
                const dist = 22 + Math.random() * 25;
                sprite.position.set(Math.cos(angle) * dist, (Math.random() - 0.5) * 12, Math.sin(angle) * dist);
                sprite.scale.set(12, 3, 1);
                scene.add(sprite);
                floatingSpriteObjects.push(sprite);
            });
        }

        function createResponsiveTexture(imageSrc, callback) {
            const img = new Image();
            img.src = imageSrc;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#0a0518'; ctx.fillRect(0, 0, 512, 512);

                const imgAspect = img.width / img.height;
                let drawWidth = 512, drawHeight = 512, offsetX = 0, offsetY = 0;

                if (imgAspect > 1) {
                    drawWidth = 512 * imgAspect;
                    offsetX = -(drawWidth - 512) / 2;
                } else {
                    drawHeight = 512 / imgAspect;
                    offsetY = -(drawHeight - 512) / 2;
                }

                ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
                callback(new THREE.CanvasTexture(canvas));
            };
            img.onerror = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 256; canvas.height = 256;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ff0066'; ctx.fillRect(0, 0, 256, 256);
                callback(new THREE.CanvasTexture(canvas));
            };
        }

        function buildPhotoPlanets() {
            planetObjects.forEach(p => scene.remove(p.group));
            planetObjects = [];

            const total = memories.length;

            memories.forEach((mem, index) => {
                const planetGroup = new THREE.Group();
                const orbitRadius = 14 + (index * 3.2);
                const angle = (index / total) * Math.PI * 2 * 1.5;
                const speed = 0.0025 + (index * 0.0002);

                const sphereGeo = new THREE.SphereGeometry(2.6, 32, 32);

                createResponsiveTexture(mem.img, (responsiveTexture) => {
                    const planetMat = new THREE.MeshStandardMaterial({
                        map: responsiveTexture, roughness: 0.3, metalness: 0.1, emissive: 0x111122, emissiveIntensity: 0.2
                    });

                    const planetMesh = new THREE.Mesh(sphereGeo, planetMat);
                    planetGroup.add(planetMesh);
                    planetGroup.userData.mesh = planetMesh;
                });

                const ringGeo = new THREE.RingGeometry(3.3, 4.0, 32);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: index % 2 === 0 ? 0x00e5ff : 0xff00aa,
                    side: THREE.DoubleSide, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2.5;
                planetGroup.add(ring);

                const glowGeo = new THREE.SphereGeometry(2.9, 16, 16);
                const glowMat = new THREE.MeshBasicMaterial({
                    color: index % 2 === 0 ? 0x00e5ff : 0xff3399,
                    transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending
                });
                const atmosphere = new THREE.Mesh(glowGeo, glowMat);
                planetGroup.add(atmosphere);

                planetGroup.position.x = Math.cos(angle) * orbitRadius;
                planetGroup.position.z = Math.sin(angle) * orbitRadius;
                planetGroup.position.y = (Math.sin(index) * 2.5);

                planetGroup.userData = {
                    id: mem.id, img: mem.img, orbitRadius: orbitRadius, angle: angle, speed: speed
                };

                scene.add(planetGroup);
                planetObjects.push({ group: planetGroup, data: planetGroup.userData });
            });
        }

        // --- CONTROLE DE TEXTO E FADE IN/OUT MARCANTE ---
        const storyOverlay = document.getElementById('story-overlay');
        const storyText = document.getElementById('story-text');
        let currentPhraseIdx = -1;
        let isTransitioningText = false;

        function updateStoryTextProgress(progress) {
            const textPhaseProgress = Math.min(progress / 0.85, 1);
            const phraseIndex = Math.floor(textPhaseProgress * STORY_PHRASES.length);
            
            if (phraseIndex < STORY_PHRASES.length && phraseIndex !== currentPhraseIdx && !isTransitioningText && progress < 0.82) {
                currentPhraseIdx = phraseIndex;
                isTransitioningText = true;

                // FADE OUT NÍTIDO
                storyOverlay.style.opacity = '0';
                
                setTimeout(() => {
                    storyText.innerText = STORY_PHRASES[currentPhraseIdx];
                    // FADE IN NÍTIDO
                    storyOverlay.style.opacity = '1';
                    setTimeout(() => { isTransitioningText = false; }, 1200);
                }, 2000);
            }

            if (progress >= 0.82) {
                storyOverlay.style.opacity = '0';
            }
        }

        // --- ANIMAÇÃO DE 1 MINUTO COM ESTRELAS REALISTAS ---
        function animate() {
            requestAnimationFrame(animate);

            if (isCollidingAnimation) {
                const elapsedTime = Date.now() - animStartTime;
                const progress = Math.min(elapsedTime / STORY_TOTAL_DURATION, 1);

                // FASE 1: Estrelas cintilando em espiral + Frases (0% a 85%)
                if (progress < 0.85) {
                    const p = progress / 0.85;
                    const smoothP = p * p * (3 - 2 * p);

                    const radius = THREE.MathUtils.lerp(85, 0, smoothP);
                    const orbitAngle = smoothP * Math.PI * 4.5;

                    star1Group.position.x = Math.cos(orbitAngle) * radius;
                    star1Group.position.z = Math.sin(orbitAngle) * radius;

                    star2Group.position.x = Math.cos(orbitAngle + Math.PI) * radius;
                    star2Group.position.z = Math.sin(orbitAngle + Math.PI) * radius;

                    // Rotação suave do flare das estrelas
                    star1Group.rotation.z += 0.02;
                    star2Group.rotation.z -= 0.02;

                    const scale = 1 + smoothP * 1.5;
                    star1Group.scale.set(scale, scale, scale);
                    star2Group.scale.set(scale, scale, scale);

                    updateStoryTextProgress(progress);
                } 
                // FASE 2: Colisão e Explosão gerando a Galáxia Hubble (85% a 100%)
                else if (progress <= 1.0) {
                    star1Group.visible = false;
                    star2Group.visible = false;

                    if (galaxyParticles) galaxyParticles.visible = true;
                    if (coreGlow) coreGlow.visible = true;
                    if (coreHalo) coreHalo.visible = true;
                    if (nebulaCloud) nebulaCloud.visible = true;
                    if (heartParticles) heartParticles.visible = true;

                    planetObjects.forEach(pl => pl.group.visible = true);
                    floatingSpriteObjects.forEach(s => s.visible = true);

                    const shockProgress = (progress - 0.85) / 0.15;
                    const smoothP = shockProgress * shockProgress * (3 - 2 * shockProgress);

                    shockwaveParticles.material.opacity = 1 - smoothP;
                    const pos = shockwaveParticles.geometry.attributes.position.array;
                    const vel = shockwaveParticles.geometry.userData.velocities;
                    for (let i = 0; i < pos.length; i++) {
                        pos[i] += vel[i] * 0.9;
                    }
                    shockwaveParticles.geometry.attributes.position.needsUpdate = true;

                    const galScale = THREE.MathUtils.lerp(0.0001, 1, smoothP);
                    
                    if (galaxyParticles) galaxyParticles.scale.set(galScale, galScale, galScale);
                    if (coreGlow) coreGlow.scale.set(galScale, galScale, galScale);
                    if (coreHalo) coreHalo.scale.set(galScale, galScale, galScale);
                    if (nebulaCloud) nebulaCloud.scale.set(galScale, galScale, galScale);
                    if (heartParticles) heartParticles.scale.set(galScale, galScale, galScale);

                    planetObjects.forEach(pl => pl.group.scale.set(galScale, galScale, galScale));
                    floatingSpriteObjects.forEach(s => s.scale.set(galScale, galScale, galScale));
                } 
                // FASE 3: Transição concluída
                else {
                    isCollidingAnimation = false;
                    isGalaxyActive = true;
                    scene.remove(shockwaveParticles);
                    scene.remove(star1Group);
                    scene.remove(star2Group);

                    document.getElementById('hud').classList.add('visible');
                    document.getElementById('hint-toast').classList.add('visible');
                    setTimeout(() => {
                        document.getElementById('hint-toast').classList.remove('visible');
                    }, 6000);
                }
            }

            // Animação Contínua 3D da Galáxia
            if (galaxyParticles) galaxyParticles.rotation.y += 0.0008;
            if (nebulaCloud) nebulaCloud.rotation.z -= 0.0005;
            if (coreGlow) coreGlow.rotation.y += 0.005;
            if (backgroundStars) backgroundStars.rotation.y += 0.0001;

            if (heartParticles && heartParticles.visible) {
                heartParticles.rotation.y += 0.003;
                const time = Date.now() * 0.0025;
                if (!isCollidingAnimation) {
                    const scale = 1 + Math.sin(time) * 0.08;
                    heartParticles.scale.set(scale, scale, scale);
                }
            }

            planetObjects.forEach(p => {
                p.data.angle += p.data.speed;
                p.group.position.x = Math.cos(p.data.angle) * p.data.orbitRadius;
                p.group.position.z = Math.sin(p.data.angle) * p.data.orbitRadius;

                if (p.group.userData.mesh) {
                    p.group.userData.mesh.rotation.y += 0.008;
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function setupInteractions() {
            window.addEventListener('click', (event) => {
                if (!isGalaxyActive) return;
                if (event.target.closest('#hud') || event.target.closest('#modal-view')) return;

                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);

                const meshesToTest = [];
                planetObjects.forEach(p => {
                    p.group.traverse(child => {
                        if (child.isMesh) {
                            child.userData.parentGroup = p.group;
                            meshesToTest.push(child);
                        }
                    });
                });

                const intersects = raycaster.intersectObjects(meshesToTest);

                if (intersects.length > 0) {
                    const hitGroup = intersects[0].object.userData.parentGroup;
                    if (hitGroup && hitGroup.userData) {
                        openMemoryModal(hitGroup.userData);
                        focusCameraOnPlanet(hitGroup.position);
                    }
                }
            });
        }

        function focusCameraOnPlanet(targetPos) {
            const startPos = camera.position.clone();
            const endPos = new THREE.Vector3(
                targetPos.x * 1.3,
                targetPos.y + 6,
                targetPos.z * 1.3
            );

            let progress = 0;
            const animateZoom = () => {
                progress += 0.04;
                if (progress <= 1) {
                    camera.position.lerpVectors(startPos, endPos, progress);
                    controls.target.copy(targetPos);
                    requestAnimationFrame(animateZoom);
                }
            };
            animateZoom();
        }

        function openMemoryModal(data) {
            document.getElementById('modal-img').src = data.img;
            document.getElementById('modal-view').classList.add('active');
        }

        document.getElementById('modal-close').addEventListener('click', () => {
            document.getElementById('modal-view').classList.remove('active');
        });

        const bgAudio = document.getElementById('bg-audio');
        let isAudioPlaying = false;

        function playMusic() {
            bgAudio.play().then(() => {
                isAudioPlaying = true;
                document.getElementById('btn-audio').style.color = '#ffffff';
            }).catch(err => {
                console.log("Aguardando interação do usuário.");
            });
        }

        document.getElementById('btn-audio').addEventListener('click', () => {
            if (isAudioPlaying) {
                bgAudio.pause();
                isAudioPlaying = false;
                document.getElementById('btn-audio').style.opacity = '0.5';
            } else {
                playMusic();
                document.getElementById('btn-audio').style.opacity = '1';
            }
        });

        document.getElementById('btn-start').addEventListener('click', () => {
            document.getElementById('landing-screen').classList.add('hidden');
            playMusic();

            isCollidingAnimation = true;
            animStartTime = Date.now();
            currentPhraseIdx = -1;
            shockwaveParticles.material.opacity = 1;
        });

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = () => {
            initThree();
            animate();
            lucide.createIcons();
        };
    </script>
</body>
